<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEAD PIXEL — Bot Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0809; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
      #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
        background: radial-gradient(ellipse at center, rgba(20,10,14,.55), rgba(5,3,4,.92)); color: #e8e2d0;
        font-family: 'VT323', monospace; text-shadow: 2px 2px 0 #000; z-index: 10; }
      #menu h1 { font-size: clamp(56px, 11vw, 132px); margin: 0; letter-spacing: 8px; line-height: .9;
        color: #f2d36b; text-shadow: 4px 4px 0 #6b1a10, 8px 8px 0 #000; }
      #menu .sub { font-size: 24px; letter-spacing: 6px; opacity: .8; margin-bottom: 12px; }
      #menu .profile { font-size: 22px; margin: 6px 0 22px; color: #9fd36b; }
      #menu button { font-family: inherit; font-size: 40px; letter-spacing: 6px; padding: 6px 48px; cursor: pointer;
        background: #f2d36b; color: #1a1210; border: none; box-shadow: 6px 6px 0 #6b1a10; }
      #menu button:hover { background: #fff0a8; }
      #menu .grid { display: grid; grid-template-columns: auto 180px 60px; gap: 6px 14px; align-items: center;
        margin-top: 26px; font-size: 22px; }
      #menu input[type=range] { width: 180px; accent-color: #f2d36b; }
      #menu select { font-family: inherit; font-size: 20px; background: #1a1210; color: #e8e2d0; border: 1px solid #6b5a42; }
      #menu .keys { margin-top: 22px; font-size: 19px; opacity: .75; text-align: center; max-width: 720px; padding: 0 16px; line-height: 1.3; }
      #menu .keys b { color: #f2d36b; font-weight: normal; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="menu">
      <h1>DEAD PIXEL</h1>
      <div class="sub">PHASE 0 · BOT TRAINING · DEPOT</div>
      <div class="profile" id="profile"></div>
      <button id="deploy">DEPLOY</button>
      <div class="grid">
        <label for="sens">SENSITIVITY</label><input id="sens" type="range" min="0.2" max="3" step="0.05" /><span id="sens-v"></span>
        <label for="fov">FIELD OF VIEW</label><input id="fov" type="range" min="65" max="100" step="1" /><span id="fov-v"></span>
        <label for="vol">VOLUME</label><input id="vol" type="range" min="0" max="1" step="0.05" /><span id="vol-v"></span>
        <label for="res">WORLD RESOLUTION</label>
        <select id="res"><option value="180">180p (crunchy)</option><option value="240">240p (PS1)</option><option value="360">360p</option><option value="480">480p</option></select><span></span>
        <label for="dither">DITHERING</label><input id="dither" type="checkbox" /><span></span>
      </div>
      <div class="keys">
        <b>WASD</b> move · <b>MOUSE</b> aim · <b>LMB</b> fire · <b>RMB</b> aim down sights · <b>SHIFT</b> sprint ·
        <b>SPACE</b> jump · <b>C</b> crouch (while sprinting: slide) · <b>R</b> reload · <b>4</b> killstreak · <b>ESC</b> pause
      </div>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
