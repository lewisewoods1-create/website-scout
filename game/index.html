<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEAD PIXEL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b0809; --ink: #e8e2d0; --dim: rgba(232,226,208,.55); --gold: #f2d36b; --blood: #6b1a10;
        --panel: rgba(12,9,11,.82); --line: rgba(232,226,208,.22); --ally: #7ec8ff; --enemy: #ff5a3a; --ok: #9fd36b;
        --display: 'Barlow Condensed', 'Arial Narrow', sans-serif; --body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
        color-scheme: dark;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
      button { font-family: inherit; }

      /* ---------- boot ---------- */
      #boot { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 34px; font-family: var(--body); cursor: pointer; transition: opacity .6s, transform .6s; }
      #boot.out { opacity: 0; transform: scale(1.08); pointer-events: none; }
      .cube-wrap { perspective: 600px; width: 110px; height: 110px; }
      .cube { width: 110px; height: 110px; position: relative; transform-style: preserve-3d; animation: spin 3.2s cubic-bezier(.6,.05,.3,1) infinite; }
      .cube i { position: absolute; inset: 0; border: 1.5px solid var(--gold);
        background: linear-gradient(135deg, rgba(242,211,107,.28), rgba(107,26,16,.18)); box-shadow: inset 0 0 24px rgba(242,211,107,.25); }
      .cube i:nth-child(1) { transform: translateZ(55px); } .cube i:nth-child(2) { transform: rotateY(180deg) translateZ(55px); }
      .cube i:nth-child(3) { transform: rotateY(90deg) translateZ(55px); } .cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(55px); }
      .cube i:nth-child(5) { transform: rotateX(90deg) translateZ(55px); } .cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(55px); }
      @keyframes spin { 0% { transform: rotateX(-25deg) rotateY(0) } 100% { transform: rotateX(-25deg) rotateY(360deg) } }
      .boot-studio { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: 8px; color: var(--dim); opacity: 0; animation: fadein .8s .4s forwards; }
      .boot-press { font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: 6px; color: var(--gold); opacity: 0; animation: fadein .4s 2.2s forwards, blink 1.1s 2.6s infinite; }
      @keyframes fadein { to { opacity: 1 } }
      @keyframes blink { 50% { opacity: .25 } }

      /* ---------- title ---------- */
      .title { font-family: var(--display); font-weight: 800; font-style: italic; line-height: .88; letter-spacing: 1px; margin: 0;
        color: var(--gold); text-shadow: 0 2px 0 var(--blood), 0 8px 24px rgba(0,0,0,.6); }
      .title span { display: inline-block; opacity: 0; transform: translateY(-28px); animation: drop .55s cubic-bezier(.2,.9,.3,1.2) forwards; }
      .title.glitch { animation: glitch 4s infinite; }
      @keyframes drop { to { opacity: 1; transform: none } }
      @keyframes glitch {
        0%, 94%, 100% { text-shadow: 0 2px 0 var(--blood), 0 8px 24px rgba(0,0,0,.6); transform: none }
        95% { text-shadow: -2px 0 0 rgba(255,42,90,.8), 2px 0 0 rgba(42,212,255,.8), 0 8px 24px rgba(0,0,0,.6); transform: translateX(2px) }
        97% { text-shadow: 2px 0 0 rgba(255,42,90,.8), -2px 0 0 rgba(42,212,255,.8), 0 8px 24px rgba(0,0,0,.6); transform: translateX(-1px) }
      }

      /* ---------- menu shell ---------- */
      #menu { position: fixed; inset: 0; z-index: 10; display: none; font-family: var(--body);
        background: linear-gradient(90deg, rgba(5,3,4,.92) 0%, rgba(5,3,4,.7) 38%, rgba(5,3,4,.15) 70%, rgba(5,3,4,.45) 100%); }
      #menu.open { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 28px; padding: 34px 40px 80px; box-sizing: border-box; }
      #menu .left { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
      #menu .left .title { font-size: clamp(44px, 5.4vw, 74px); }
      #menu .tag { font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: 5px; color: var(--dim); margin-top: -10px; }
      #menu nav { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
      #menu nav button { all: unset; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: 1.5px; padding: 6px 12px;
        color: var(--ink); opacity: 0; transform: translateX(-24px); animation: slidein .35s forwards; border-left: 3px solid transparent; }
      #menu nav button:hover, #menu nav button:focus-visible { background: rgba(242,211,107,.12); border-left-color: var(--gold); color: var(--gold); }
      #menu nav button.on { background: rgba(242,211,107,.18); border-left-color: var(--gold); color: var(--gold); }
      #menu nav button small { font-family: var(--body); font-weight: 400; font-size: 13px; letter-spacing: .5px; text-transform: uppercase; color: var(--dim); margin-left: 8px; }
      #menu.static .title span, #menu.static nav button, #menu.static .panel { animation: none; opacity: 1; transform: none; }
      @keyframes slidein { to { opacity: 1; transform: none } }
      #menu .panel { align-self: start; justify-self: end; width: min(760px, 100%); max-height: calc(100vh - 140px); overflow: auto;
        background: var(--panel); border: 1px solid var(--line); padding: 20px 24px; box-sizing: border-box; animation: panelin .3s; }
      @keyframes panelin { from { opacity: 0; transform: translateY(8px) } }
      #menu h2 { font-family: var(--display); font-weight: 800; font-size: 30px; margin: 0 0 4px; color: var(--gold); letter-spacing: 1px; }
      #menu .sub { font-size: 15px; color: var(--dim); margin-bottom: 14px; }
      #menu .profilebar { position: fixed; left: 40px; right: 40px; bottom: 18px; display: flex; gap: 18px; align-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }
      #menu .profilebar .lvl { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--gold); }
      #menu .profilebar .xp { flex: 1; max-width: 420px; height: 6px; background: rgba(255,255,255,.12); }
      #menu .profilebar .xp i { display: block; height: 100%; background: var(--gold); }
      .row { display: flex; flex-wrap: wrap; gap: 8px; }
      .card { all: unset; cursor: pointer; box-sizing: border-box; border: 1px solid var(--line); padding: 10px 12px; background: rgba(255,255,255,.03);
        display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .card:hover, .card:focus-visible { border-color: var(--gold); }
      .card.on { border-color: var(--gold); background: rgba(242,211,107,.12); box-shadow: inset 3px 0 0 var(--gold); }
      .card.locked { opacity: .45; cursor: not-allowed; }
      .card b { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: .5px; }
      .card span { font-size: 13px; line-height: 1.35; color: var(--dim); }
      .card .lock { color: var(--enemy); font-size: 12px; font-weight: 600; letter-spacing: .5px; }
      .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
      .label { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: 3px; color: var(--dim); margin: 14px 0 6px; }
      .go { all: unset; cursor: pointer; font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: 2px; padding: 8px 30px; margin-top: 18px;
        background: var(--gold); color: #1a1210; box-shadow: 5px 5px 0 var(--blood); }
      .go:hover, .go:focus-visible { background: #fff0a8; }
      .go[disabled] { background: #4a4438; color: #8a8270; box-shadow: none; cursor: not-allowed; }
      .stat { display: grid; grid-template-columns: 80px 1fr; gap: 8px; align-items: center; font-size: 12px; letter-spacing: 1px; color: var(--dim); }
      .stat .b { height: 6px; background: rgba(255,255,255,.1); } .stat .b i { display: block; height: 100%; background: var(--gold); }
      .cac { display: grid; grid-template-columns: 1fr; gap: 6px; }
      .preview { width: 100%; aspect-ratio: 21 / 8; max-width: 100%; background: radial-gradient(ellipse at center, #2a1f22, #0b0809 75%); border: 1px solid var(--line); display: block; }
      .swatch { width: 34px; height: 34px; border: 2px solid var(--line); cursor: pointer; padding: 0; position: relative; }
      .swatch.on { border-color: var(--gold); outline: 2px solid var(--gold); outline-offset: 2px; }
      .swatch.locked { opacity: .35; cursor: not-allowed; }
      .playlist { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; font-family: var(--display); font-weight: 600; font-size: 19px; padding: 8px 0; border-bottom: 1px solid var(--line); }
      .chip { font-family: var(--body); font-weight: 600; font-size: 11px; letter-spacing: 2px; padding: 1px 8px; border: 1px solid currentColor; color: var(--enemy); align-self: center; }
      .chip.ok { color: var(--ok); }
      .settings { display: grid; grid-template-columns: auto minmax(120px, 200px) 60px; gap: 8px 14px; align-items: center; font-size: 15px; }
      .settings input[type=range] { width: 100%; accent-color: var(--gold); }
      .settings select { font-family: inherit; font-size: 14px; background: #1a1210; color: var(--ink); border: 1px solid #6b5a42; }
      .keys { font-size: 13px; color: var(--dim); margin-top: 14px; line-height: 1.35; }
      .keys b { color: var(--gold); font-weight: normal; }
      input.name { font-family: var(--display); font-weight: 700; font-size: 18px; background: rgba(0,0,0,.4); color: var(--gold); border: 1px solid var(--line); padding: 4px 8px; width: 220px; max-width: 100%; }
      @media (max-width: 760px) {
        #menu.open { grid-template-columns: 1fr; padding: 20px 16px 80px; overflow: auto; }
        #menu .panel { justify-self: stretch; max-height: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cube, .title.glitch, .boot-press { animation: none !important; }
        .title span, #menu nav button { animation-duration: .01s !important; }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="boot">
      <div class="cube-wrap"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <div class="boot-studio">LOW-RES INTERACTIVE PRESENTS</div>
      <h1 class="title" id="boot-title" style="font-size:clamp(54px,10vw,120px)"></h1>
      <div class="boot-press">PRESS ANY KEY</div>
    </div>
    <div id="menu"></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
