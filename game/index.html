<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEAD PIXEL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b0809; --ink: #e8e2d0; --dim: rgba(232,226,208,.55); --gold: #f2d36b; --blood: #6b1a10;
        --panel: rgba(12,9,11,.82); --line: rgba(232,226,208,.22); --ally: #7ec8ff; --enemy: #ff5a3a; --ok: #9fd36b;
        --display: 'Barlow Condensed', 'Arial Narrow', sans-serif; --body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
        color-scheme: dark;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
      button { font-family: inherit; }

      /* ---------- boot ---------- */
      #boot { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 34px; font-family: var(--body); cursor: pointer; transition: opacity .6s, transform .6s; }
      #boot.out { opacity: 0; transform: scale(1.08); pointer-events: none; }
      .cube-wrap { perspective: 600px; width: 110px; height: 110px; }
      .cube { width: 110px; height: 110px; position: relative; transform-style: preserve-3d; animation: spin 3.2s cubic-bezier(.6,.05,.3,1) infinite; }
      .cube i { position: absolute; inset: 0; border: 1.5px solid var(--gold);
        background: linear-gradient(135deg, rgba(242,211,107,.28), rgba(107,26,16,.18)); box-shadow: inset 0 0 24px rgba(242,211,107,.25); }
      .cube i:nth-child(1) { transform: translateZ(55px); } .cube i:nth-child(2) { transform: rotateY(180deg) translateZ(55px); }
      .cube i:nth-child(3) { transform: rotateY(90deg) translateZ(55px); } .cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(55px); }
      .cube i:nth-child(5) { transform: rotateX(90deg) translateZ(55px); } .cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(55px); }
      @keyframes spin { 0% { transform: rotateX(-25deg) rotateY(0) } 100% { transform: rotateX(-25deg) rotateY(360deg) } }
      .boot-studio { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: 8px; color: var(--dim); opacity: 0; animation: fadein .8s .4s forwards; }
      .boot-press { font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: 6px; color: var(--gold); opacity: 0; animation: fadein .4s 2.2s forwards, blink 1.1s 2.6s infinite; }
      @keyframes fadein { to { opacity: 1 } }
      @keyframes blink { 50% { opacity: .25 } }

      /* ---------- title ---------- */
      .title { font-family: var(--display); font-weight: 800; font-style: italic; line-height: .88; letter-spacing: 1px; margin: 0;
        color: var(--gold); text-shadow: 0 2px 0 var(--blood), 0 8px 24px rgba(0,0,0,.6); }
      .title span { display: inline-block; opacity: 0; transform: translateY(-28px); animation: drop .55s cubic-bezier(.2,.9,.3,1.2) forwards; }
      .title.glitch { animation: glitch 4s infinite; }
      @keyframes drop { to { opacity: 1; transform: none } }
      @keyframes glitch {
        0%, 94%, 100% { text-shadow: 0 2px 0 var(--blood), 0 8px 24px rgba(0,0,0,.6); transform: none }
        95% { text-shadow: -2px 0 0 rgba(255,42,90,.8), 2px 0 0 rgba(42,212,255,.8), 0 8px 24px rgba(0,0,0,.6); transform: translateX(2px) }
        97% { text-shadow: 2px 0 0 rgba(255,42,90,.8), -2px 0 0 rgba(42,212,255,.8), 0 8px 24px rgba(0,0,0,.6); transform: translateX(-1px) }
      }

      /* ---------- menu shell ---------- */
      #menu { position: fixed; inset: 0; z-index: 10; display: none; font-family: var(--body);
        background: linear-gradient(90deg, rgba(5,3,4,.92) 0%, rgba(5,3,4,.7) 38%, rgba(5,3,4,.15) 70%, rgba(5,3,4,.45) 100%); }
      #menu.open.home { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 28px; padding: 34px 40px 30px; box-sizing: border-box; }
      #menu.open.paged { display: block; background: linear-gradient(180deg, rgba(8,5,6,.94), rgba(8,5,6,.9)); }
      #menu .left { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
      #menu .left .title { font-size: clamp(40px, 4.6vw, 64px); margin-top: 10px; }
      #menu .tag { font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: 5px; color: var(--dim); margin-top: -10px; }
      #menu .left nav { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
      #menu .left nav button { all: unset; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: 1.5px; padding: 6px 12px;
        color: var(--ink); opacity: 0; transform: translateX(-24px); animation: slidein .35s forwards; border-left: 3px solid transparent; }
      #menu .left nav button:hover, #menu .left nav button:focus-visible { background: rgba(242,211,107,.12); border-left-color: var(--gold); color: var(--gold); }
      #menu .left nav button.on { background: rgba(242,211,107,.18); border-left-color: var(--gold); color: var(--gold); }
      #menu .left nav button small { font-family: var(--body); font-weight: 400; font-size: 13px; letter-spacing: .5px; text-transform: uppercase; color: var(--dim); margin-left: 8px; }
      #menu.static .title span, #menu.static .left nav button, #menu.static .pinner { animation: none; opacity: 1; transform: none; }
      @keyframes slidein { to { opacity: 1; transform: none } }
      /* home: nav on the left, challenge teaser bottom-right */
      #menu .home-side { align-self: end; justify-self: end; width: min(340px, 100%); display: flex; flex-direction: column; gap: 6px;
        background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; box-sizing: border-box; animation: panelin .4s .4s backwards; }
      .mini-ch { all: unset; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
      .mini-ch:hover b, .mini-ch:focus-visible b { color: var(--gold); }
      .mini-ch b { font-family: var(--display); font-weight: 700; font-size: 16px; grid-column: 1 / -1; }
      .mini-ch span { font-size: 12px; color: var(--dim); grid-column: 1 / -1; }
      .mini-ch .pbar { grid-column: 1; align-self: center; }
      .mini-ch em { font-style: normal; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--dim); }
      /* full pages */
      #menu .page { position: absolute; inset: 0; display: flex; flex-direction: column; }
      #menu .ph { display: grid; grid-template-columns: auto 1fr minmax(200px, 250px); align-items: center; gap: 18px; padding: 12px 32px;
        border-bottom: 1px solid var(--line); background: rgba(0,0,0,.35); }
      #menu .back { all: unset; cursor: pointer; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: 1px; color: var(--gold); padding: 6px 12px 6px 6px; }
      #menu .back small { font-family: var(--body); font-weight: 600; font-size: 11px; letter-spacing: 2px; color: var(--dim); margin-left: 6px; border: 1px solid var(--line); padding: 1px 5px; }
      #menu .back:hover, #menu .back:focus-visible { color: #fff0a8; }
      #menu .ptabs { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; }
      #menu .ptabs button { all: unset; cursor: pointer; white-space: nowrap; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: 1.5px; padding: 8px 14px; color: var(--dim);
        border-bottom: 3px solid transparent; }
      #menu .ptabs button:hover, #menu .ptabs button:focus-visible { color: var(--ink); }
      #menu .ptabs button.on { color: var(--gold); border-bottom-color: var(--gold); }
      #menu .ph-card .pcard { min-height: 0; }
      #menu .pbody { flex: 1; overflow: auto; padding: 22px 32px 40px; }
      #menu .pinner { max-width: 1320px; margin: 0 auto; animation: panelin .3s; }
      @keyframes panelin { from { opacity: 0; transform: translateY(8px) } }
      .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
      .cols2.wide-right { grid-template-columns: 1fr 1.1fr; }
      .pbar { height: 5px; background: rgba(255,255,255,.1); margin: 6px 0 2px; }
      .pbar i { display: block; height: 100%; background: var(--gold); }
      .card .stat { margin-top: 4px; grid-template-columns: 70px 1fr; }
      .card .stat .pbar { margin: 0; }
      .info-list { display: flex; flex-direction: column; gap: 10px; }
      .info-list div { display: flex; flex-direction: column; gap: 2px; border-left: 3px solid var(--gold); padding: 4px 12px; background: rgba(255,255,255,.03); }
      .info-list b { font-family: var(--display); font-weight: 700; font-size: 18px; }
      .info-list span { font-size: 14px; color: var(--dim); }
      .playlist small { display: block; font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--dim); }
      .map-hero { position: relative; height: 170px; border: 1px solid var(--line); display: flex; align-items: flex-end; margin-bottom: 10px; }
      .map-hero > div { width: 100%; padding: 10px 14px; background: linear-gradient(0deg, rgba(0,0,0,.8), transparent); display: flex; flex-direction: column; gap: 2px; }
      .map-hero b { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: 1px; text-shadow: 0 2px 6px #000; }
      .map-hero span { font-size: 14px; color: var(--ink); opacity: .85; }
      .map-hero em { font-style: normal; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 2px; color: var(--gold); }
      .grid-keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 14px; font-size: 14px; }
      /* create a class */
      .cac-layout { display: grid; grid-template-columns: 220px minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start; }
      .cac-classes { display: flex; flex-direction: column; gap: 8px; }
      .cac-classes input.name { width: auto; }
      .sheet { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; padding: 10px 12px; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
      .sheet span { color: var(--dim); letter-spacing: 1px; font-size: 12px; align-self: center; }
      .sheet b { font-family: var(--display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
      .choices .card .prog { font-variant-numeric: tabular-nums; }
      .choices .card .pbar { margin-top: 2px; }
      /* challenges */
      .fchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
      .fchip { all: unset; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 1.5px; padding: 5px 12px; border: 1px solid var(--line); color: var(--dim); }
      .fchip:hover, .fchip:focus-visible { color: var(--ink); border-color: var(--ink); }
      .fchip.on { color: #1a1210; background: var(--gold); border-color: var(--gold); }
      .chgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
      .chcard { border: 1px solid var(--line); background: rgba(255,255,255,.03); display: flex; flex-direction: column; }
      .chcard.done { border-color: rgba(242,211,107,.6); }
      .chban { position: relative; height: 64px; overflow: hidden; }
      .chcard:not(.done) .chban { filter: grayscale(.6) brightness(.7); }
      .chn { position: absolute; left: 8px; top: 6px; font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 1px; text-shadow: 0 1px 3px #000; }
      .chk { position: absolute; right: 8px; top: 4px; font-size: 20px; color: var(--gold); text-shadow: 0 1px 3px #000; }
      .chtxt { padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 2px; }
      .chtxt b { font-family: var(--display); font-weight: 700; font-size: 18px; }
      .chtxt span { font-size: 13px; color: var(--dim); }
      .chfoot { display: flex; justify-content: space-between; gap: 8px; }
      .chfoot em { font-style: normal; font-size: 12px; letter-spacing: .5px; color: var(--dim); font-variant-numeric: tabular-nums; }
      .chcard.done .chfoot em:first-child { color: var(--gold); font-weight: 600; }
      /* barracks: record + camo mastery */
      .record { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
      .record div { border: 1px solid var(--line); padding: 8px 10px; background: rgba(255,255,255,.03); display: flex; flex-direction: column; }
      .record b { font-family: var(--display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
      .record span { font-size: 11px; letter-spacing: 1.5px; color: var(--dim); }
      .mastery { border: 1px solid var(--line); padding: 12px 14px; margin-bottom: 12px; background: rgba(255,255,255,.03); }
      .mastery.got { border-color: var(--gold); background: rgba(242,211,107,.07); }
      .mastery .mh { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
      .mastery .mh b { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: .5px; display: block; }
      .mastery .mh span { font-size: 13px; color: var(--dim); }
      .camo-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 4px 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
      .camo-row b { font-family: var(--display); font-weight: 700; font-size: 15px; }
      .camo-row .sws { display: flex; gap: 4px; }
      .camo-row .hk { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
      .camo-row .pbar { grid-column: 1 / -1; margin: 0; }
      .sw.off { opacity: .25; filter: grayscale(1); }
      /* calling cards (pixel art: keep it crisp) */
      .pcard.art { display: block; padding: 0; min-height: 0; background: #0c0a0b; }
      .pcard.art::before { display: none; }
      .pc-art { aspect-ratio: 4 / 1; image-rendering: pixelated; }
      .pc-strip { display: flex; align-items: center; gap: 10px; padding: 6px 10px 9px; background: linear-gradient(180deg, #17120f, #0c0a0b); }
      .pc-strip .pc-name { font-size: 22px; }
      .pcard.art.compact .pc-strip { padding: 4px 8px 7px; }
      .pcard.art.compact .pc-name { font-size: 18px; }
      .bcard.art { height: auto; aspect-ratio: 4 / 1; image-rendering: pixelated; }
      .banners.cards { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
      .chtheme .label { color: var(--gold); }
      .chban { height: auto !important; aspect-ratio: 4 / 1; image-rendering: pixelated; }
      .tier { font-family: var(--display); font-weight: 700; font-size: 12px !important; letter-spacing: 2px; }
      .tier.t1 { color: #9aa3ab !important; } .tier.t2 { color: #c98a4a !important; } .tier.t3 { color: #d5dde4 !important; }
      .tier.t4 { color: #f2d36b !important; } .tier.t5 { color: #ffe9a0 !important; text-shadow: 0 0 8px rgba(242,211,107,.6); }
      .choice-group { grid-column: 1 / -1; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 3px; color: var(--gold); padding: 6px 2px 0; }
      /* killstreak picker */
      .picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 4px; }
      .picks .pick { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; padding: 10px 12px;
        border: 1px solid var(--gold); background: rgba(242,211,107,.08); color: var(--gold); }
      .picks .pick svg { grid-row: 1 / 3; }
      .picks .pick b { font-family: var(--display); font-weight: 800; font-size: 19px; color: var(--ink); }
      .picks .pick span { font-size: 12px; letter-spacing: 1.5px; color: var(--dim); }
      .picks .pick.empty { border-style: dashed; border-color: var(--line); background: none; }
      .streakgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
      .card.streakcard { position: relative; }
      .streakcard .sk-ic { color: var(--gold); margin-bottom: 4px; }
      .streakcard .kc { font-family: var(--display); font-weight: 700; letter-spacing: 2px; color: var(--gold) !important; }
      .streakcard .slotn { position: absolute; right: 10px; top: 8px; font-style: normal; font-family: var(--display); font-weight: 800; font-size: 22px;
        width: 30px; height: 30px; display: grid; place-items: center; background: var(--gold); color: #1a1210; }
      .sw.big { width: 40px; height: 40px; }
      #menu h2 { font-family: var(--display); font-weight: 800; font-size: 30px; margin: 0 0 4px; color: var(--gold); letter-spacing: 1px; }
      #menu .sub { font-size: 15px; color: var(--dim); margin-bottom: 14px; }
      #menu .profilebar { position: fixed; left: 40px; right: 40px; bottom: 18px; display: flex; gap: 18px; align-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }
      #menu .profilebar .lvl { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--gold); }
      #menu .profilebar .xp { flex: 1; max-width: 420px; height: 6px; background: rgba(255,255,255,.12); }
      #menu .profilebar .xp i { display: block; height: 100%; background: var(--gold); }
      .row { display: flex; flex-wrap: wrap; gap: 8px; }
      .card { all: unset; cursor: pointer; box-sizing: border-box; border: 1px solid var(--line); padding: 10px 12px; background: rgba(255,255,255,.03);
        display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .card:hover, .card:focus-visible { border-color: var(--gold); }
      .card.on { border-color: var(--gold); background: rgba(242,211,107,.12); box-shadow: inset 3px 0 0 var(--gold); }
      .card.locked { opacity: .45; cursor: not-allowed; }
      .card b { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: .5px; }
      .card span { font-size: 13px; line-height: 1.35; color: var(--dim); }
      .card .lock { color: var(--enemy); font-size: 12px; font-weight: 600; letter-spacing: .5px; }
      .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
      .label { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: 3px; color: var(--dim); margin: 14px 0 6px; }
      .go { all: unset; cursor: pointer; font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: 2px; padding: 8px 30px; margin-top: 18px;
        background: var(--gold); color: #1a1210; box-shadow: 5px 5px 0 var(--blood); }
      .go:hover, .go:focus-visible { background: #fff0a8; }
      .go[disabled] { background: #4a4438; color: #8a8270; box-shadow: none; cursor: not-allowed; }
      .stat { display: grid; grid-template-columns: 80px 1fr; gap: 8px; align-items: center; font-size: 12px; letter-spacing: 1px; color: var(--dim); }
      .stat .b { height: 6px; background: rgba(255,255,255,.1); } .stat .b i { display: block; height: 100%; background: var(--gold); }
      .cac { display: grid; grid-template-columns: 1fr; gap: 6px; }
      .preview { width: 100%; aspect-ratio: 21 / 8; max-width: 100%; background: radial-gradient(ellipse at center, #2a1f22, #0b0809 75%); border: 1px solid var(--line); display: block; }
      .swatch { width: 34px; height: 34px; border: 2px solid var(--line); cursor: pointer; padding: 0; position: relative; }
      .swatch.on { border-color: var(--gold); outline: 2px solid var(--gold); outline-offset: 2px; }
      .swatch.locked { opacity: .35; cursor: not-allowed; }
      .playlist { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; font-family: var(--display); font-weight: 600; font-size: 19px; padding: 8px 0; border-bottom: 1px solid var(--line); }
      .chip { font-family: var(--body); font-weight: 600; font-size: 11px; letter-spacing: 2px; padding: 1px 8px; border: 1px solid currentColor; color: var(--enemy); align-self: center; }
      .chip.ok { color: var(--ok); }
      .settings { display: grid; grid-template-columns: auto minmax(120px, 200px) 60px; gap: 8px 14px; align-items: center; font-size: 15px; }
      .settings input[type=range] { width: 100%; accent-color: var(--gold); }
      .settings select { font-family: inherit; font-size: 14px; background: #1a1210; color: var(--ink); border: 1px solid #6b5a42; }
      .keys { font-size: 13px; color: var(--dim); margin-top: 14px; line-height: 1.35; }
      .keys b { color: var(--gold); font-weight: normal; }
      input.name { font-family: var(--display); font-weight: 700; font-size: 18px; background: rgba(0,0,0,.4); color: var(--gold); border: 1px solid var(--line); padding: 4px 8px; width: 220px; max-width: 100%; }
      /* player card + rank */
      #menu .rank { display: flex; flex-direction: column; gap: 6px; }
      #menu .rk-next.bottom { margin-top: auto; }
      img.badge { display: block; image-rendering: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,.55)); user-select: none; }
      #menu .rk-xp { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
      #menu .rk-next { font-size: 12px; color: var(--dim); letter-spacing: 1px; }
      #menu .rk-next b { color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .5px; }
      .pcard { position: relative; overflow: hidden; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center;
        padding: 8px 12px 12px; min-height: 84px; border: 1px solid rgba(255,255,255,.18); box-shadow: 0 6px 20px rgba(0,0,0,.4); }
      .pcard::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,.1) 70%); }
      .pcard > * { position: relative; }
      .pc-motif { position: absolute; right: 0; top: 0; bottom: 0; width: 45%; opacity: .55; display: flex; align-items: flex-end; justify-content: flex-end; }
      .pc-motif svg { height: 100%; max-width: 100%; }
      .pc-badge svg, .pc-badge img { display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
      .pc-name { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: 1px; line-height: 1; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
      .pc-rank { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 1.5px; opacity: .9; margin-top: 4px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
      .pc-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,.5); }
      .pc-bar i { display: block; height: 100%; background: var(--gold); }
      .go.ghost { background: transparent; color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); }
      .group-label { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 3px; color: var(--gold); padding: 14px 6px 6px; border-bottom: 1px solid var(--line); }
      /* soldier tab */
      .soldier-wrap { display: grid; grid-template-columns: minmax(200px, 300px) 1fr; gap: 16px; align-items: start; margin-top: 10px; }
      .soldier-side { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .studio.tall { margin: 0; }
      .studio .preview.tall { aspect-ratio: 3 / 4; }
      .banners { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
      .bcard { all: unset; cursor: pointer; position: relative; height: 54px; overflow: hidden; border: 1px solid rgba(255,255,255,.18); box-sizing: border-box; }
      .bcard.on { outline: 2px solid var(--gold); outline-offset: 2px; }
      .bcard.locked { filter: grayscale(1) brightness(.45); cursor: not-allowed; }
      .bcard .bname { position: absolute; left: 8px; bottom: 6px; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 1px; text-shadow: 0 1px 3px #000; }
      .bcard .block { position: absolute; right: 6px; top: 5px; font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--enemy); text-shadow: 0 1px 2px #000; }
      /* barracks */
      .rankhead { display: flex; gap: 14px; align-items: center; margin: 6px 0 12px; }
      .rk-big { font-family: var(--display); font-weight: 800; font-size: 28px; color: var(--gold); }
      .prestige-box { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid var(--gold); background: rgba(242,211,107,.07); }
      .prestige-box b { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: 1px; }
      .prestige-box span { font-size: 13px; color: var(--dim); }
      .prestige-box .go { align-self: flex-start; margin-top: 8px; }
      .emblems { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px 8px; }
      .emb { display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: .3; filter: grayscale(.8); font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .5px; text-align: center; }
      .emb.got { opacity: 1; filter: none; }
      /* maps */
      .maps { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
      .card.map { padding: 0 0 10px; overflow: hidden; }
      .card.map .thumb { display: block; height: 64px; margin-bottom: 6px; }
      .card.map b, .card.map span { padding: 0 12px; }
      /* create a class */
      .row input.name { align-self: stretch; }
      .studio { position: relative; margin: 14px 0 10px; border: 1px solid var(--line);
        background: radial-gradient(ellipse at 50% 40%, #d8d3c9 0%, #9b958a 60%, #5e5952 100%); }
      .studio .preview { display: block; width: 100%; aspect-ratio: 21 / 8; border: 0; background: none; }
      .studio-info { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
        background: rgba(12,9,11,.85); padding: 8px 12px; border-top: 1px solid var(--line); }
      .studio-info b { flex: 0 0 auto; margin-right: 6px; }
      .studio-info .stat { flex: 1 1 80px; grid-template-columns: 1fr; gap: 3px; }
      .studio-info b { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--gold); }
      .slots { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
      .slot { all: unset; cursor: pointer; display: grid; grid-template-columns: 120px 1fr 24px; align-items: center; gap: 10px; padding: 10px 6px;
        border-bottom: 1px solid var(--line); }
      .slot:hover, .slot:focus-visible, .slot.open { background: rgba(242,211,107,.08); }
      .slot .sl { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 2px; color: var(--dim); }
      .slot .sv { font-family: var(--display); font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 8px; min-width: 0; }
      .slot .chev { font-family: var(--display); font-size: 22px; color: var(--gold); text-align: center; }
      .sw { display: inline-block; width: 18px; height: 18px; border: 1px solid rgba(255,255,255,.35); flex: none; }
      .sw.none { visibility: hidden; }
      .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; padding: 10px 6px 14px; border-bottom: 1px solid var(--line); }
      .choices .card b { display: flex; align-items: center; gap: 8px; }
      .choices .card .sw { margin-bottom: 4px; }
      @media (max-width: 760px) {
        #menu.open.home { grid-template-columns: 1fr; padding: 20px 16px 80px; overflow: auto; }
        #menu .home-side { justify-self: stretch; }
        #menu .ph { grid-template-columns: auto 1fr; padding: 8px 16px; }
        #menu .ph-card { display: none; }
        #menu .ptabs { justify-content: flex-start; overflow-x: auto; flex-wrap: nowrap; }
        #menu .pbody { padding: 16px 16px 40px; }
      }
      @media (max-width: 1100px) {
        .cac-layout { grid-template-columns: 1fr 1fr; }
        .cac-classes { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
        .cac-classes .label { grid-column: 1 / -1; }
      }
      @media (max-width: 860px) {
        .cols2, .cols2.wide-right, .cac-layout { grid-template-columns: 1fr; }
        .soldier-wrap { grid-template-columns: 1fr; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cube, .title.glitch, .boot-press { animation: none !important; }
        .title span, #menu .left nav button { animation-duration: .01s !important; }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="boot">
      <div class="cube-wrap"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <div class="boot-studio">LOW-RES INTERACTIVE PRESENTS</div>
      <h1 class="title" id="boot-title" style="font-size:clamp(54px,10vw,120px)"></h1>
      <div class="boot-press">PRESS ANY KEY</div>
    </div>
    <div id="menu"></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
